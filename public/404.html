<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting · EVA DYNAMO LTD</title>
    <script>
      (() => {
        const destination = window.location.pathname + window.location.search + window.location.hash;
        try {
          window.sessionStorage.setItem('gh-redirect', destination);
        } catch (_) {
          // If session storage is unavailable, send visitors to the homepage.
        }
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to EVA DYNAMO LTD…</p>
  </body>
</html>
